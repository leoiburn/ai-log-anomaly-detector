# Hardware & Thermal Monitoring for GPU/CPU Cluster
# Deploys NVIDIA DCGM Exporter and Prometheus Node Exporter DaemonSets.
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-dcgm-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: nvidia-dcgm-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nvidia-dcgm-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvidia-dcgm-exporter
    spec:
      containers:
        - name: dcgm-exporter
          image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.5-3.4.0-ubuntu22.04
          securityContext:
            capabilities:
              add:
                - SYS_ADMIN
          ports:
            - name: metrics
              containerPort: 9400
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter-hardware
  namespace: monitoring
  labels:
    app.kubernetes.io/name: node-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-exporter
    spec:
      hostNetwork: true
      hostPID: true
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.8.1
          args:
            - "--path.sysfs=/host/sys"
            - "--collector.hwmon"   # Exposes node_hwmon_temp_celsius (CPU & Chassis temps)
            - "--collector.thermal_zone"
          ports:
            - name: metrics
              containerPort: 9100
          volumeMounts:
            - name: sys
              mountPath: /host/sys
              readOnly: true
      volumes:
        - name: sys
          hostPath:
            path: /sys
